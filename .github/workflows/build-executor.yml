name: Build Executor

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # --- Ubuntu Setup ---
    - name: Install Qt5 & Dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y qt5-default qttools5-dev-tools libgl1-mesa-dev
        qmake --version

    - name: Build on Ubuntu
      if: runner.os == 'Linux'
      run: |
        qmake NovaUltimate.pro
        make -j$(nproc)

    # --- macOS Setup ---
    - name: Install Qt5 (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install qt
        echo "PATH=$HOME/.pub-cache/bin:$HOME/flutter/bin:/usr/local/opt/qt/bin:$PATH" >> $GITHUB_ENV

    - name: Build on macOS
      if: runner.os == 'macOS'
      run: |
        qmake NovaUltimate.pro
        make -j$(sysctl -n hw.ncpu)

    # --- Windows Setup ---
    - name: Set up MSVC
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Qt5 (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install qt5 --yes
        echo "C:\Qt\5.15.2\msvc2019_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Build on Windows
      if: runner.os == 'Windows'
      run: |
        qmake NovaUltimate.pro
        nmake

    # --- Upload Artifacts ---
    - name: Upload Linux Binary
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: executor-linux
        path: ./NovaUltimate

    - name: Upload macOS Binary
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: executor-macos
        path: ./NovaUltimate

    - name: Upload Windows Binary
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: executor-windows
        path: Release/NovaUltimate.exe
