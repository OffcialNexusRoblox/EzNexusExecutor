name: Build Executor

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Use ubuntu-22.04 to keep qt5-default available
        os: [ubuntu-22.04, macos-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # --- Ubuntu Setup ---
    - name: Install Qt5 & Dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y qt5-default qttools5-dev-tools libgl1-mesa-dev g++ make
        qmake --version

    - name: Build on Ubuntu
      if: runner.os == 'Linux'
      run: |
        qmake NovaUltimate.pro
        make -j$(nproc)

    # --- macOS Setup ---
    - name: Install Qt5 (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install qt
        echo "/opt/homebrew/opt/qt/bin" >> $GITHUB_PATH

    - name: Build on macOS
      if: runner.os == 'macOS'
      run: |
        qmake NovaUltimate.pro
        make -j$(sysctl -n hw.ncpu)

    # --- Windows Setup ---
    - name: Set up MSVC
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Qt via Vcpkg (Windows)
      if: runner.os == 'Windows'
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg install qtbase:x64-windows qttools:x64-windows
        echo "C:\vcpkg\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo "QT_QMAKE_EXECUTABLE=C:\vcpkg\installed\x64-windows\tools\qml\qmake.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        # Also set QT_DIR for qmake to find plugins/libs
        echo "QT_DIR=C:\vcpkg\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Build on Windows
      if: runner.os == 'Windows'
      run: |
        qmake NovaUltimate.pro
        nmake

    # --- Upload Artifacts ---
    - name: Upload Linux Binary
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: executor-linux
        path: ./NovaUltimate

    - name: Upload macOS Binary
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: executor-macos
        path: ./NovaUltimate

    - name: Upload Windows Binary
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: executor-windows
        path: Release/NovaUltimate.exe
